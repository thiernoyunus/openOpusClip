services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
      # Sign in with ChatGPT: OpenAI redirects the browser to 127.0.0.1:1455.
      - "127.0.0.1:1455:1455"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    environment:
      - RENDER_SERVICE_URL=http://renderer:3100
      - CHATGPT_CALLBACK_HOST=0.0.0.0
      - CHATGPT_ALLOW_REMOTE=1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - ./remotion:/remotion:ro
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
